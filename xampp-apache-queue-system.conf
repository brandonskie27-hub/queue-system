# Copy of D:/xampp/apache/conf/extra/httpd-queue-system.conf. To set up another PC: copy this
# file there as httpd-queue-system.conf, enable mod_proxy_http and mod_proxy_wstunnel in
# httpd.conf, add "Include conf/extra/httpd-queue-system.conf" at its end, restart Apache.
#
# PHINMA UPANG queue system
#
# Students open http://<this PC's IP>:8000. Apache forwards the pages to the Herd site
# (queue-system.test, which runs the app on PHP 8.4) and the live-update WebSocket to
# Laravel Reverb on port 8080. XAMPP's own sites on port 80 are not affected.
Listen 8000

<VirtualHost *:8000>
    ServerName queue-system-lan

    # Ignore any forwarded host a client sends; Apache adds the real one when proxying.
    RequestHeader unset X-Forwarded-Host early

    # Live updates (Laravel Reverb). Must come before the catch-all below.
    ProxyPass        /app ws://127.0.0.1:8080/app
    ProxyPassReverse /app ws://127.0.0.1:8080/app

    # Everything else: the Laravel app served by Herd.
    ProxyPreserveHost Off
    ProxyPass        / http://queue-system.test/
    ProxyPassReverse / http://queue-system.test/
</VirtualHost>
